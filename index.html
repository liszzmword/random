<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 발표 순서 추첨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: linear-gradient(145deg, #2d2d44, #1a1a2e);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255,255,255,0.1);
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2.2rem;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #444;
            border-radius: 12px;
            font-size: 16px;
            background: #2a2a3e;
            color: white;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .input-group input::placeholder {
            color: #666;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-start {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            font-size: 20px;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(231, 76, 60, 0.5);
        }

        .btn-start:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: #333;
            color: #888;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #444;
            color: #aaa;
        }

        .member-list {
            margin-top: 20px;
        }

        .member-list h3 {
            color: #888;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .members {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .member-tag {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            animation: popIn 0.3s ease;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .member-tag .remove {
            cursor: pointer;
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            line-height: 1;
            transition: color 0.2s;
        }

        .member-tag .remove:hover {
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 20px;
        }

        /* 로또 추첨기 스타일 */
        .lotto-machine {
            margin-top: 30px;
            display: none;
        }

        .lotto-machine.active {
            display: block;
        }

        .machine-container {
            background: linear-gradient(180deg, #2a2a3e 0%, #1a1a2e 100%);
            border-radius: 20px;
            padding: 30px;
            border: 3px solid #444;
            position: relative;
            overflow: hidden;
        }

        .machine-title {
            text-align: center;
            color: #ffd700;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* 공이 섞이는 드럼 */
        .drum {
            width: 100%;
            height: 200px;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 100%);
            border-radius: 100px / 50px;
            border: 4px solid #555;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: inset 0 20px 60px rgba(0,0,0,0.8);
        }

        .drum.spinning .ball {
            animation: spin 0.15s linear infinite;
        }

        .ball {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.4),
                        inset 3px 3px 10px rgba(255,255,255,0.2),
                        0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            text-align: center;
            padding: 5px;
            word-break: keep-all;
            overflow: hidden;
        }

        @keyframes spin {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, -15px) rotate(90deg); }
            50% { transform: translate(-10px, 10px) rotate(180deg); }
            75% { transform: translate(-20px, -10px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        .ball.selected {
            animation: popOut 0.5s ease forwards;
        }

        @keyframes popOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(0); opacity: 0; }
        }

        /* 추출구 */
        .chute {
            width: 80px;
            height: 30px;
            background: linear-gradient(180deg, #333, #222);
            border-radius: 0 0 40px 40px;
            margin: 0 auto;
            position: relative;
            border: 3px solid #555;
            border-top: none;
        }

        .chute::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: #222;
            border-radius: 50%;
        }

        /* 결과 표시 영역 */
        .result-track {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 30px;
            min-height: 100px;
            padding: 20px;
            background: linear-gradient(180deg, #1a1a2e, #2a2a3e);
            border-radius: 15px;
            border: 2px solid #444;
        }

        .result-slot {
            width: 70px;
            height: 90px;
            background: linear-gradient(180deg, #222, #1a1a2e);
            border-radius: 10px;
            border: 2px dashed #444;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .result-slot .order-label {
            position: absolute;
            top: -12px;
            background: #ffd700;
            color: #1a1a2e;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .result-slot.filled {
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .result-ball {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 11px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: inset -3px -3px 10px rgba(0,0,0,0.4),
                        inset 3px 3px 10px rgba(255,255,255,0.2),
                        0 5px 15px rgba(0,0,0,0.3);
            animation: dropIn 0.5s ease;
            text-align: center;
            padding: 5px;
            word-break: keep-all;
        }

        @keyframes dropIn {
            0% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
            60% {
                transform: translateY(10px);
            }
            80% {
                transform: translateY(-5px);
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 공 색상 배열 */
        .ball-color-1 { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .ball-color-2 { background: linear-gradient(135deg, #3498db, #2980b9); }
        .ball-color-3 { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .ball-color-4 { background: linear-gradient(135deg, #f39c12, #d68910); }
        .ball-color-5 { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .ball-color-6 { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .ball-color-7 { background: linear-gradient(135deg, #e91e63, #c2185b); }
        .ball-color-8 { background: linear-gradient(135deg, #00bcd4, #0097a7); }
        .ball-color-9 { background: linear-gradient(135deg, #ff5722, #e64a19); }
        .ball-color-10 { background: linear-gradient(135deg, #607d8b, #455a64); }

        /* 완료 메시지 */
        .complete-message {
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .complete-message.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .complete-message h2 {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .complete-message p {
            color: #888;
        }

        /* 순서 목록 (최종 결과) */
        .final-result {
            margin-top: 20px;
            display: none;
        }

        .final-result.show {
            display: block;
        }

        .final-result h3 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
        }

        .final-list {
            list-style: none;
        }

        .final-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #ffd700;
        }

        .final-item .num {
            width: 35px;
            height: 35px;
            background: #ffd700;
            color: #1a1a2e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .final-item .name {
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 팀 발표 순서 추첨</h1>
        
        <div class="input-section" id="inputSection">
            <label>팀원 이름 추가</label>
            <div class="input-group">
                <input type="text" id="memberInput" placeholder="이름을 입력하세요" onkeypress="handleKeyPress(event)">
                <button class="btn btn-add" onclick="addMember()">추가</button>
            </div>
            
            <div class="member-list">
                <h3>참가자 목록 (<span id="memberCount">0</span>명)</h3>
                <div class="members" id="memberTags">
                    <div class="empty-state">아직 추가된 팀원이 없습니다</div>
                </div>
            </div>

            <button class="btn btn-start" id="startBtn" onclick="startLotto()" disabled>
                🎱 추첨 시작
            </button>
            <button class="btn btn-reset" onclick="resetAll()">
                초기화
            </button>
        </div>

        <!-- 로또 추첨기 -->
        <div class="lotto-machine" id="lottoMachine">
            <div class="machine-container">
                <div class="machine-title">🎱 추첨 중...</div>
                <div class="drum" id="drum"></div>
                <div class="chute"></div>
            </div>

            <div class="result-track" id="resultTrack"></div>

            <div class="complete-message" id="completeMessage">
                <h2>🎉 추첨 완료!</h2>
                <p>발표 순서가 결정되었습니다</p>
            </div>

            <div class="final-result" id="finalResult">
                <h3>📋 최종 발표 순서</h3>
                <ul class="final-list" id="finalList"></ul>
            </div>

            <button class="btn btn-start" onclick="resetAll()" style="margin-top: 20px;">
                🔄 다시 추첨하기
            </button>
        </div>
    </div>

    <script>
        let members = [];
        let remainingMembers = [];
        let selectedOrder = [];
        let isDrawing = false;

        const ballColors = [
            'ball-color-1', 'ball-color-2', 'ball-color-3', 'ball-color-4', 'ball-color-5',
            'ball-color-6', 'ball-color-7', 'ball-color-8', 'ball-color-9', 'ball-color-10'
        ];

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addMember();
            }
        }

        function addMember() {
            const input = document.getElementById('memberInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('이름을 입력해주세요!');
                return;
            }
            
            if (members.includes(name)) {
                alert('이미 추가된 이름입니다!');
                return;
            }
            
            members.push(name);
            input.value = '';
            input.focus();
            updateMemberDisplay();
        }

        function removeMember(name) {
            members = members.filter(m => m !== name);
            updateMemberDisplay();
        }

        function updateMemberDisplay() {
            const tagsContainer = document.getElementById('memberTags');
            const countSpan = document.getElementById('memberCount');
            const startBtn = document.getElementById('startBtn');
            
            countSpan.textContent = members.length;
            startBtn.disabled = members.length < 2;
            
            if (members.length === 0) {
                tagsContainer.innerHTML = '<div class="empty-state">아직 추가된 팀원이 없습니다</div>';
                return;
            }
            
            tagsContainer.innerHTML = members.map((name, idx) => `
                <div class="member-tag">
                    ${name}
                    <span class="remove" onclick="removeMember('${name}')">&times;</span>
                </div>
            `).join('');
        }

        function startLotto() {
            if (members.length < 2) {
                alert('최소 2명 이상의 팀원이 필요합니다!');
                return;
            }

            // UI 전환
            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('lottoMachine').classList.add('active');

            // 초기화
            remainingMembers = [...members];
            selectedOrder = [];
            isDrawing = true;

            // 결과 슬롯 생성
            createResultSlots();

            // 드럼에 공 배치
            createBalls();

            // 추첨 시작
            setTimeout(() => {
                drawNextBall();
            }, 1000);
        }

        function createResultSlots() {
            const track = document.getElementById('resultTrack');
            track.innerHTML = members.map((_, idx) => `
                <div class="result-slot" id="slot-${idx}">
                    <span class="order-label">${idx + 1}번</span>
                </div>
            `).join('');
        }

        function createBalls() {
            const drum = document.getElementById('drum');
            drum.innerHTML = '';

            remainingMembers.forEach((name, idx) => {
                const ball = document.createElement('div');
                ball.className = `ball ${ballColors[idx % ballColors.length]}`;
                ball.id = `ball-${idx}`;
                ball.textContent = name;
                
                // 랜덤 위치
                const x = 30 + Math.random() * (drum.offsetWidth - 100);
                const y = 30 + Math.random() * (drum.offsetHeight - 100);
                ball.style.left = x + 'px';
                ball.style.top = y + 'px';
                
                drum.appendChild(ball);
            });
        }

        function drawNextBall() {
            if (remainingMembers.length === 0) {
                finishDrawing();
                return;
            }

            const drum = document.getElementById('drum');
            drum.classList.add('spinning');

            // 회전 시간 (랜덤하게)
            const spinTime = 1500 + Math.random() * 1000;

            setTimeout(() => {
                drum.classList.remove('spinning');

                // 랜덤하게 하나 선택
                const randomIdx = Math.floor(Math.random() * remainingMembers.length);
                const selectedName = remainingMembers[randomIdx];
                const selectedColorClass = ballColors[members.indexOf(selectedName) % ballColors.length];

                // 드럼에서 공 제거 애니메이션
                const balls = drum.querySelectorAll('.ball');
                balls.forEach(ball => {
                    if (ball.textContent === selectedName) {
                        ball.classList.add('selected');
                    }
                });

                // 결과 슬롯에 공 추가
                setTimeout(() => {
                    const slotIdx = selectedOrder.length;
                    const slot = document.getElementById(`slot-${slotIdx}`);
                    
                    const resultBall = document.createElement('div');
                    resultBall.className = `result-ball ${selectedColorClass}`;
                    resultBall.textContent = selectedName;
                    slot.appendChild(resultBall);
                    slot.classList.add('filled');

                    // 배열 업데이트
                    selectedOrder.push(selectedName);
                    remainingMembers = remainingMembers.filter(m => m !== selectedName);

                    // 드럼 공 재배치
                    createBalls();

                    // 다음 공 추첨
                    setTimeout(() => {
                        drawNextBall();
                    }, 800);

                }, 500);

            }, spinTime);
        }

        function finishDrawing() {
            isDrawing = false;

            // 완료 메시지 표시
            document.getElementById('completeMessage').classList.add('show');

            // 최종 결과 목록 표시
            setTimeout(() => {
                const finalResult = document.getElementById('finalResult');
                const finalList = document.getElementById('finalList');

                finalList.innerHTML = selectedOrder.map((name, idx) => `
                    <li class="final-item" style="animation: fadeIn 0.5s ease ${idx * 0.1}s forwards; opacity: 0;">
                        <div class="num">${idx + 1}</div>
                        <div class="name">${name}</div>
                    </li>
                `).join('');

                finalResult.classList.add('show');
            }, 500);

            // 기계 타이틀 변경
            document.querySelector('.machine-title').textContent = '🎉 추첨 완료!';
        }

        function resetAll() {
            members = [];
            remainingMembers = [];
            selectedOrder = [];
            isDrawing = false;

            updateMemberDisplay();

            // UI 원래대로
            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('lottoMachine').classList.remove('active');
            document.getElementById('completeMessage').classList.remove('show');
            document.getElementById('finalResult').classList.remove('show');
            document.querySelector('.machine-title').textContent = '🎱 추첨 중...';
            document.getElementById('drum').innerHTML = '';
            document.getElementById('resultTrack').innerHTML = '';
            document.getElementById('finalList').innerHTML = '';
        }
    </script>
</body>
</html>
