<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 발표 순서 추첨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background: #667eea;
            color: white;
        }

        .btn-add:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }

        .btn-shuffle {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            margin-top: 20px;
        }

        .btn-shuffle:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-shuffle:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: #f0f0f0;
            color: #666;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .member-list {
            margin-top: 20px;
        }

        .member-list h3 {
            color: #555;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .members {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .member-tag {
            background: #f0f4ff;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .member-tag .remove {
            cursor: pointer;
            color: #999;
            font-size: 18px;
            line-height: 1;
        }

        .member-tag .remove:hover {
            color: #e74c3c;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px dashed #e0e0e0;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.3rem;
        }

        .result-list {
            list-style: none;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9ff;
            border-radius: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
            transform: translateX(-20px);
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .result-item .order {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            margin-right: 15px;
        }

        .result-item .name {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }

        .result-item:nth-child(1) .order {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .result-item:nth-child(2) .order {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .result-item:nth-child(3) .order {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .shuffling .result-item {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 팀 발표 순서 추첨</h1>
        
        <div class="input-section">
            <label>팀원 이름 추가</label>
            <div class="input-group">
                <input type="text" id="memberInput" placeholder="이름을 입력하세요" onkeypress="handleKeyPress(event)">
                <button class="btn btn-add" onclick="addMember()">추가</button>
            </div>
            
            <div class="member-list">
                <h3>참가자 목록 (<span id="memberCount">0</span>명)</h3>
                <div class="members" id="memberTags">
                    <div class="empty-state" id="emptyState">아직 추가된 팀원이 없습니다</div>
                </div>
            </div>
        </div>

        <button class="btn btn-shuffle" id="shuffleBtn" onclick="shuffleMembers()" disabled>
            🎯 순서 추첨하기
        </button>
        <button class="btn btn-reset" onclick="resetAll()">
            초기화
        </button>

        <div class="result-section" id="resultSection" style="display: none;">
            <h3>📋 발표 순서</h3>
            <ul class="result-list" id="resultList"></ul>
        </div>
    </div>

    <script>
        let members = [];

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addMember();
            }
        }

        function addMember() {
            const input = document.getElementById('memberInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('이름을 입력해주세요!');
                return;
            }
            
            if (members.includes(name)) {
                alert('이미 추가된 이름입니다!');
                return;
            }
            
            members.push(name);
            input.value = '';
            input.focus();
            updateMemberDisplay();
        }

        function removeMember(name) {
            members = members.filter(m => m !== name);
            updateMemberDisplay();
        }

        function updateMemberDisplay() {
            const tagsContainer = document.getElementById('memberTags');
            const countSpan = document.getElementById('memberCount');
            const emptyState = document.getElementById('emptyState');
            const shuffleBtn = document.getElementById('shuffleBtn');
            
            countSpan.textContent = members.length;
            shuffleBtn.disabled = members.length < 2;
            
            if (members.length === 0) {
                tagsContainer.innerHTML = '<div class="empty-state">아직 추가된 팀원이 없습니다</div>';
                return;
            }
            
            tagsContainer.innerHTML = members.map(name => `
                <div class="member-tag">
                    ${name}
                    <span class="remove" onclick="removeMember('${name}')">&times;</span>
                </div>
            `).join('');
        }

        function shuffleMembers() {
            if (members.length < 2) {
                alert('최소 2명 이상의 팀원이 필요합니다!');
                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            const resultList = document.getElementById('resultList');
            const shuffleBtn = document.getElementById('shuffleBtn');
            
            // 셔플 애니메이션
            shuffleBtn.disabled = true;
            shuffleBtn.textContent = '🎲 추첨 중...';
            resultSection.style.display = 'block';
            resultList.classList.add('shuffling');
            
            // 여러 번 섞는 애니메이션 효과
            let shuffleCount = 0;
            const maxShuffles = 10;
            
            const shuffleInterval = setInterval(() => {
                const tempOrder = [...members].sort(() => Math.random() - 0.5);
                displayResult(tempOrder, false);
                shuffleCount++;
                
                if (shuffleCount >= maxShuffles) {
                    clearInterval(shuffleInterval);
                    
                    // 최종 결과
                    const finalOrder = [...members].sort(() => Math.random() - 0.5);
                    resultList.classList.remove('shuffling');
                    displayResult(finalOrder, true);
                    
                    shuffleBtn.disabled = false;
                    shuffleBtn.textContent = '🎯 다시 추첨하기';
                }
            }, 100);
        }

        function displayResult(order, animate) {
            const resultList = document.getElementById('resultList');
            
            resultList.innerHTML = order.map((name, index) => `
                <li class="result-item" style="animation-delay: ${animate ? index * 0.1 : 0}s">
                    <div class="order">${index + 1}</div>
                    <div class="name">${name}</div>
                </li>
            `).join('');
        }

        function resetAll() {
            members = [];
            updateMemberDisplay();
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('shuffleBtn').textContent = '🎯 순서 추첨하기';
        }
    </script>
</body>
</html>
