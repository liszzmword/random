<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냥 발표 순서 추첨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #fff5f5 0%, #ffe4ec 50%, #ffd6e0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 배경 발자국들 */
        body::before {
            content: '🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾';
            position: fixed;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 20px;
            opacity: 0.2;
            letter-spacing: 30px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(255, 150, 180, 0.3);
            max-width: 650px;
            width: 100%;
            border: 3px solid #ffb6c1;
            position: relative;
        }

        /* 고양이 귀 장식 */
        .cat-ears {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 80px;
        }

        .ear {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffb6c1, #ff91a4);
            border-radius: 50% 50% 0 0;
            transform: rotate(-15deg);
            border: 3px solid white;
            position: relative;
        }

        .ear:last-child {
            transform: rotate(15deg);
        }

        .ear::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background: #ffd1dc;
            border-radius: 50% 50% 0 0;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        h1 {
            text-align: center;
            color: #ff6b8a;
            margin-bottom: 10px;
            font-size: 2rem;
            margin-top: 10px;
        }

        .subtitle {
            text-align: center;
            color: #ffaa00;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* 고양이 얼굴 */
        .cat-face {
            width: 120px;
            height: 100px;
            margin: 0 auto 20px;
            position: relative;
        }

        .cat-face .face {
            width: 100px;
            height: 80px;
            background: #ffeaa7;
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            border: 3px solid #f0d78c;
        }

        .cat-face .eyes {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
        }

        .cat-face .eye {
            width: 12px;
            height: 18px;
            background: #333;
            border-radius: 50%;
            position: relative;
            animation: blink 3s infinite;
        }

        .cat-face .eye::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 2px;
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .cat-face .nose {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 8px;
            background: #ff91a4;
            border-radius: 50% 50% 40% 40%;
        }

        .cat-face .mouth {
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            border: 2px solid #333;
            border-top: none;
            border-radius: 0 0 50% 50%;
            background: transparent;
        }

        .cat-face .whiskers {
            position: absolute;
            top: 45px;
            width: 100%;
        }

        .cat-face .whisker {
            position: absolute;
            width: 30px;
            height: 2px;
            background: #aaa;
            border-radius: 2px;
        }

        .cat-face .whisker:nth-child(1) { left: -5px; top: 0; transform: rotate(-10deg); }
        .cat-face .whisker:nth-child(2) { left: -8px; top: 10px; transform: rotate(5deg); }
        .cat-face .whisker:nth-child(3) { right: -5px; top: 0; transform: rotate(10deg); }
        .cat-face .whisker:nth-child(4) { right: -8px; top: 10px; transform: rotate(-5deg); }

        .input-section label {
            display: block;
            margin-bottom: 10px;
            color: #ff6b8a;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #ffb6c1;
            border-radius: 20px;
            font-size: 16px;
            background: #fff9fa;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff6b8a;
            box-shadow: 0 0 15px rgba(255, 107, 138, 0.2);
        }

        .input-group input::placeholder {
            color: #ddd;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add {
            background: linear-gradient(135deg, #ff91a4, #ff6b8a);
            color: white;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 138, 0.4);
        }

        .btn-start {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #ff6b8a, #ff4757);
            color: white;
            font-size: 18px;
            margin-top: 20px;
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        .btn-start::before {
            content: '🐱';
            margin-right: 10px;
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.4);
        }

        .btn-start:disabled {
            background: #ddd;
            cursor: not-allowed;
            transform: none;
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: #f5f5f5;
            color: #888;
            margin-top: 10px;
        }

        .btn-reset:hover {
            background: #eee;
        }

        .member-list {
            margin-top: 20px;
        }

        .member-list h3 {
            color: #ff6b8a;
            margin-bottom: 15px;
            font-size: 1rem;
        }

        .members {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 물고기 모양 태그 */
        .member-tag {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            padding: 10px 20px;
            border-radius: 30px 15px 30px 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            animation: fishSwim 0.5s ease;
            box-shadow: 0 4px 15px rgba(9, 132, 227, 0.3);
            position: relative;
        }

        .member-tag::before {
            content: '🐟';
            margin-right: 5px;
        }

        @keyframes fishSwim {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .member-tag .remove {
            cursor: pointer;
            color: rgba(255,255,255,0.8);
            font-size: 18px;
            line-height: 1;
        }

        .member-tag .remove:hover {
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: #ccc;
            padding: 20px;
            font-style: italic;
        }

        /* 로또 추첨기 (고양이 버전) */
        .lotto-machine {
            display: none;
        }

        .lotto-machine.active {
            display: block;
        }

        .machine-cat {
            text-align: center;
            margin-bottom: 20px;
        }

        .big-cat {
            width: 150px;
            height: 130px;
            margin: 0 auto;
            position: relative;
        }

        .big-cat .body {
            width: 140px;
            height: 100px;
            background: #ffeaa7;
            border-radius: 70px 70px 50px 50px;
            margin: 0 auto;
            position: relative;
            border: 3px solid #f0d78c;
        }

        .big-cat .cat-ear-left,
        .big-cat .cat-ear-right {
            position: absolute;
            width: 35px;
            height: 40px;
            background: #ffeaa7;
            border: 3px solid #f0d78c;
            border-radius: 50% 50% 0 0;
            top: -20px;
        }

        .big-cat .cat-ear-left {
            left: 15px;
            transform: rotate(-15deg);
        }

        .big-cat .cat-ear-right {
            right: 15px;
            transform: rotate(15deg);
        }

        .big-cat .cat-ear-left::after,
        .big-cat .cat-ear-right::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 20px;
            background: #ffb6c1;
            border-radius: 50% 50% 0 0;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .big-cat .eyes {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 35px;
        }

        .big-cat .eye {
            width: 18px;
            height: 25px;
            background: #333;
            border-radius: 50%;
            position: relative;
        }

        .big-cat .eye::after {
            content: '';
            position: absolute;
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
            top: 5px;
            left: 3px;
        }

        .big-cat.excited .eye {
            animation: excitedEyes 0.3s infinite alternate;
        }

        @keyframes excitedEyes {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .big-cat .nose {
            position: absolute;
            top: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 10px;
            background: #ff91a4;
            border-radius: 50% 50% 40% 40%;
        }

        .big-cat .mouth {
            position: absolute;
            top: 63px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
        }

        .big-cat .paws {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
        }

        .big-cat .paw {
            width: 30px;
            height: 20px;
            background: #ffeaa7;
            border-radius: 50%;
            border: 3px solid #f0d78c;
            position: relative;
            animation: pawMove 0.5s infinite alternate;
        }

        .big-cat .paw:last-child {
            animation-delay: 0.25s;
        }

        @keyframes pawMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .machine-message {
            text-align: center;
            color: #ff6b8a;
            font-size: 1.3rem;
            margin: 15px 0;
            font-weight: bold;
        }

        /* 물고기 바구니 (드럼 대체) */
        .fish-basket {
            width: 100%;
            max-width: 400px;
            height: 150px;
            background: linear-gradient(180deg, #e8d4a8, #d4b896);
            border-radius: 10px 10px 50px 50px;
            margin: 0 auto 20px;
            position: relative;
            border: 4px solid #c9a87c;
            overflow: hidden;
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.1);
        }

        .fish-basket::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(180deg, rgba(255,255,255,0.3), transparent);
        }

        .fish-basket.shaking {
            animation: basketShake 0.1s infinite;
        }

        @keyframes basketShake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
        }

        .fish-ball {
            position: absolute;
            width: 55px;
            height: 35px;
            border-radius: 50% 20% 50% 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 10px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: all 0.3s;
            text-align: center;
        }

        .fish-ball::before {
            content: '';
            position: absolute;
            right: -8px;
            width: 15px;
            height: 20px;
            background: inherit;
            border-radius: 0 50% 50% 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        .fish-ball.caught {
            animation: fishCaught 0.5s ease forwards;
        }

        @keyframes fishCaught {
            0% { transform: scale(1) rotate(0); }
            50% { transform: scale(1.2) rotate(10deg) translateY(-30px); }
            100% { transform: scale(0) rotate(20deg) translateY(-50px); opacity: 0; }
        }

        /* 물고기 색상 */
        .fish-color-1 { background: linear-gradient(135deg, #ff6b6b, #ee5a5a); }
        .fish-color-2 { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .fish-color-3 { background: linear-gradient(135deg, #55efc4, #00b894); }
        .fish-color-4 { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
        .fish-color-5 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .fish-color-6 { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .fish-color-7 { background: linear-gradient(135deg, #81ecec, #00cec9); }
        .fish-color-8 { background: linear-gradient(135deg, #fab1a0, #e17055); }
        .fish-color-9 { background: linear-gradient(135deg, #dfe6e9, #b2bec3); }
        .fish-color-10 { background: linear-gradient(135deg, #ffc048, #ff9f1a); }

        /* 결과 접시들 */
        .result-dishes {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
            padding: 20px;
        }

        .dish {
            width: 75px;
            height: 85px;
            background: linear-gradient(180deg, #fff, #f5f5f5);
            border-radius: 50%;
            border: 3px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .dish .order-num {
            position: absolute;
            top: -10px;
            background: #ff6b8a;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid white;
        }

        .dish.filled {
            border-color: #ff6b8a;
            background: linear-gradient(180deg, #fff5f7, #ffe8ec);
        }

        .result-fish {
            width: 50px;
            height: 30px;
            border-radius: 50% 20% 50% 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 9px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            animation: fishLand 0.5s ease;
            position: relative;
        }

        .result-fish::before {
            content: '';
            position: absolute;
            right: -7px;
            width: 12px;
            height: 16px;
            background: inherit;
            border-radius: 0 50% 50% 0;
            clip-path: polygon(0 50%, 100% 0, 100% 100%);
        }

        @keyframes fishLand {
            0% { transform: translateY(-80px) rotate(360deg); opacity: 0; }
            60% { transform: translateY(5px) rotate(0); }
            80% { transform: translateY(-3px); }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* 완료 화면 */
        .complete-section {
            text-align: center;
            margin-top: 25px;
            display: none;
        }

        .complete-section.show {
            display: block;
            animation: popUp 0.5s ease;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .complete-section h2 {
            color: #ff6b8a;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .complete-section p {
            color: #aaa;
            font-size: 14px;
        }

        /* 최종 결과 */
        .final-result {
            margin-top: 20px;
            display: none;
        }

        .final-result.show {
            display: block;
        }

        .final-result h3 {
            color: #ff6b8a;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .final-list {
            list-style: none;
        }

        .final-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(135deg, #fff5f7, #ffe8ec);
            border-radius: 15px;
            margin-bottom: 8px;
            border-left: 4px solid #ff6b8a;
            opacity: 0;
            animation: slideIn 0.4s ease forwards;
        }

        @keyframes slideIn {
            0% { opacity: 0; transform: translateX(-20px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        .final-item .num {
            width: 30px;
            height: 30px;
            background: #ff6b8a;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            margin-right: 15px;
        }

        .final-item .name {
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }

        .final-item .name::before {
            content: '🐟 ';
        }

        /* 고양이 발바닥 장식 */
        .paw-prints {
            text-align: center;
            margin-top: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 고양이 귀 장식 -->
        <div class="cat-ears">
            <div class="ear"></div>
            <div class="ear"></div>
        </div>

        <h1>냥냥 발표 순서 추첨</h1>
        <p class="subtitle">~ 고양이가 물고기를 잡아드려요 ~</p>

        <!-- 메인 고양이 얼굴 -->
        <div class="cat-face">
            <div class="face">
                <div class="eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
                <div class="nose"></div>
                <div class="mouth"></div>
                <div class="whiskers">
                    <div class="whisker"></div>
                    <div class="whisker"></div>
                    <div class="whisker"></div>
                    <div class="whisker"></div>
                </div>
            </div>
        </div>

        <div class="input-section" id="inputSection">
            <label>🐟 팀원 이름 추가</label>
            <div class="input-group">
                <input type="text" id="memberInput" placeholder="이름을 입력하세요 냥~" onkeypress="handleKeyPress(event)">
                <button class="btn btn-add" onclick="addMember()">추가</button>
            </div>
            
            <div class="member-list">
                <h3>물고기 목록 (<span id="memberCount">0</span>마리)</h3>
                <div class="members" id="memberTags">
                    <div class="empty-state">아직 물고기가 없어요... 🐱</div>
                </div>
            </div>

            <button class="btn btn-start" id="startBtn" onclick="startLotto()" disabled>
                추첨 시작 냥!
            </button>
            <button class="btn btn-reset" onclick="resetAll()">
                초기화
            </button>
        </div>

        <!-- 추첨 화면 -->
        <div class="lotto-machine" id="lottoMachine">
            <div class="machine-cat">
                <div class="big-cat" id="bigCat">
                    <div class="body">
                        <div class="cat-ear-left"></div>
                        <div class="cat-ear-right"></div>
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="nose"></div>
                        <div class="mouth" id="catMouth">ω</div>
                    </div>
                    <div class="paws">
                        <div class="paw"></div>
                        <div class="paw"></div>
                    </div>
                </div>
            </div>

            <p class="machine-message" id="machineMessage">물고기를 고르는 중이다냥... 🐾</p>

            <div class="fish-basket" id="fishBasket"></div>

            <div class="result-dishes" id="resultDishes"></div>

            <div class="complete-section" id="completeSection">
                <h2>🎉 추첨 완료다냥!</h2>
                <p>맛있는 물고기 순서가 정해졌어요</p>
            </div>

            <div class="final-result" id="finalResult">
                <h3>📋 최종 발표 순서</h3>
                <ul class="final-list" id="finalList"></ul>
            </div>

            <button class="btn btn-start" onclick="resetAll()" style="margin-top: 20px;">
                🔄 다시 추첨하기 냥!
            </button>

            <div class="paw-prints">🐾 🐾 🐾</div>
        </div>
    </div>

    <script>
        let members = [];
        let remainingMembers = [];
        let selectedOrder = [];
        let isDrawing = false;

        const fishColors = [
            'fish-color-1', 'fish-color-2', 'fish-color-3', 'fish-color-4', 'fish-color-5',
            'fish-color-6', 'fish-color-7', 'fish-color-8', 'fish-color-9', 'fish-color-10'
        ];

        const catMessages = [
            "어떤 물고기를 잡을까냥... 🤔",
            "냠냠... 맛있겠다냥! 😋",
            "이 물고기다냥! 🐟",
            "잡았다냥~! 🐱",
            "다음 물고기는... 🎣",
            "고르는 중이다냥... 🐾"
        ];

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addMember();
            }
        }

        function addMember() {
            const input = document.getElementById('memberInput');
            const name = input.value.trim();
            
            if (name === '') {
                alert('이름을 입력해주세요 냥!');
                return;
            }
            
            if (members.includes(name)) {
                alert('이미 추가된 이름이다냥!');
                return;
            }
            
            members.push(name);
            input.value = '';
            input.focus();
            updateMemberDisplay();
        }

        function removeMember(name) {
            members = members.filter(m => m !== name);
            updateMemberDisplay();
        }

        function updateMemberDisplay() {
            const tagsContainer = document.getElementById('memberTags');
            const countSpan = document.getElementById('memberCount');
            const startBtn = document.getElementById('startBtn');
            
            countSpan.textContent = members.length;
            startBtn.disabled = members.length < 2;
            
            if (members.length === 0) {
                tagsContainer.innerHTML = '<div class="empty-state">아직 물고기가 없어요... 🐱</div>';
                return;
            }
            
            tagsContainer.innerHTML = members.map((name, idx) => `
                <div class="member-tag">
                    ${name}
                    <span class="remove" onclick="removeMember('${name}')">&times;</span>
                </div>
            `).join('');
        }

        function startLotto() {
            if (members.length < 2) {
                alert('최소 2마리 이상의 물고기가 필요하다냥!');
                return;
            }

            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('lottoMachine').classList.add('active');
            document.querySelector('.cat-face').style.display = 'none';

            remainingMembers = [...members];
            selectedOrder = [];
            isDrawing = true;

            createResultDishes();
            createFish();

            setTimeout(() => {
                catchNextFish();
            }, 1000);
        }

        function createResultDishes() {
            const dishes = document.getElementById('resultDishes');
            dishes.innerHTML = members.map((_, idx) => `
                <div class="dish" id="dish-${idx}">
                    <span class="order-num">${idx + 1}</span>
                </div>
            `).join('');
        }

        function createFish() {
            const basket = document.getElementById('fishBasket');
            basket.innerHTML = '';

            remainingMembers.forEach((name, idx) => {
                const fish = document.createElement('div');
                fish.className = `fish-ball ${fishColors[members.indexOf(name) % fishColors.length]}`;
                fish.id = `fish-${idx}`;
                fish.textContent = name;
                
                const x = 20 + Math.random() * (basket.offsetWidth - 80);
                const y = 20 + Math.random() * (basket.offsetHeight - 60);
                fish.style.left = x + 'px';
                fish.style.top = y + 'px';
                
                basket.appendChild(fish);
            });
        }

        function catchNextFish() {
            if (remainingMembers.length === 0) {
                finishDrawing();
                return;
            }

            const basket = document.getElementById('fishBasket');
            const bigCat = document.getElementById('bigCat');
            const message = document.getElementById('machineMessage');
            const catMouth = document.getElementById('catMouth');

            // 고양이 흥분 모드
            bigCat.classList.add('excited');
            basket.classList.add('shaking');
            message.textContent = catMessages[Math.floor(Math.random() * catMessages.length)];
            catMouth.textContent = '∀';

            const shakeTime = 1200 + Math.random() * 800;

            setTimeout(() => {
                basket.classList.remove('shaking');
                catMouth.textContent = '▽';

                // 랜덤 선택
                const randomIdx = Math.floor(Math.random() * remainingMembers.length);
                const selectedName = remainingMembers[randomIdx];
                const selectedColorClass = fishColors[members.indexOf(selectedName) % fishColors.length];

                message.textContent = `${selectedName} 물고기를 잡았다냥! 🐟`;

                // 물고기 잡기 애니메이션
                const fishes = basket.querySelectorAll('.fish-ball');
                fishes.forEach(fish => {
                    if (fish.textContent === selectedName) {
                        fish.classList.add('caught');
                    }
                });

                setTimeout(() => {
                    const dishIdx = selectedOrder.length;
                    const dish = document.getElementById(`dish-${dishIdx}`);
                    
                    const resultFish = document.createElement('div');
                    resultFish.className = `result-fish ${selectedColorClass}`;
                    resultFish.textContent = selectedName;
                    dish.appendChild(resultFish);
                    dish.classList.add('filled');

                    selectedOrder.push(selectedName);
                    remainingMembers = remainingMembers.filter(m => m !== selectedName);

                    bigCat.classList.remove('excited');
                    catMouth.textContent = 'ω';

                    createFish();

                    setTimeout(() => {
                        catchNextFish();
                    }, 700);

                }, 500);

            }, shakeTime);
        }

        function finishDrawing() {
            isDrawing = false;

            document.getElementById('machineMessage').textContent = '모든 물고기를 잡았다냥! 🎉';
            document.getElementById('catMouth').textContent = '▽';
            document.getElementById('completeSection').classList.add('show');

            setTimeout(() => {
                const finalResult = document.getElementById('finalResult');
                const finalList = document.getElementById('finalList');

                finalList.innerHTML = selectedOrder.map((name, idx) => `
                    <li class="final-item" style="animation-delay: ${idx * 0.1}s">
                        <div class="num">${idx + 1}</div>
                        <div class="name">${name}</div>
                    </li>
                `).join('');

                finalResult.classList.add('show');
            }, 500);
        }

        function resetAll() {
            members = [];
            remainingMembers = [];
            selectedOrder = [];
            isDrawing = false;

            updateMemberDisplay();

            document.getElementById('inputSection').style.display = 'block';
            document.getElementById('lottoMachine').classList.remove('active');
            document.getElementById('completeSection').classList.remove('show');
            document.getElementById('finalResult').classList.remove('show');
            document.getElementById('machineMessage').textContent = '물고기를 고르는 중이다냥... 🐾';
            document.getElementById('fishBasket').innerHTML = '';
            document.getElementById('resultDishes').innerHTML = '';
            document.getElementById('finalList').innerHTML = '';
            document.querySelector('.cat-face').style.display = 'block';
        }
    </script>
</body>
</html>
